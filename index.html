<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>LongVision · Plano protegido</title>
<style>
  :root{color-scheme:light dark;--bg:#eef1f0;--panel:#fff;--text:#1a1a1a;--muted:#5b6b68;--border:#dbe1df;--verde:#007E7B;--verdeEsc:#005A58;--bad:#b91c1c}
  @media(prefers-color-scheme:dark){:root{--bg:#0b1514;--panel:#101f1e;--text:#e7f0ef;--muted:#93a8a5;--border:#22403d;--verde:#3aa9a5;--verdeEsc:#7fc9c6;--bad:#f87171}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 26px;max-width:360px;width:100%;
    box-shadow:0 6px 24px rgba(16,58,55,.08);text-align:center}
  .mark{width:46px;height:46px;border-radius:11px;margin:0 auto 14px;background:linear-gradient(135deg,var(--verdeEsc),var(--verde));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
  h1{font-size:16px;margin:0 0 4px}
  p{font-size:12.5px;color:var(--muted);margin:0 0 18px;line-height:1.5}
  input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--border);border-radius:10px;
    background:var(--bg);color:var(--text);text-align:center;letter-spacing:.5px}
  input:focus-visible{outline:2px solid var(--verde);outline-offset:1px}
  button{width:100%;margin-top:12px;font:inherit;font-size:14px;font-weight:700;padding:11px;border:0;border-radius:10px;
    background:var(--verde);color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="mark">LV</div>
  <h1>Plano LLV São Paulo</h1>
  <p>Conteúdo protegido. Digite a senha para acessar o plano de campanha.</p>
  <form id="f">
    <input type="password" id="pw" placeholder="Senha" autocomplete="current-password" autofocus>
    <button id="go" type="submit">Acessar</button>
    <div class="err" id="err"></div>
  </form>
</div>

document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;err.textContent='';
  try{
    const pw=document.getElementById('pw').value;
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:un(SALT),iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);

    err.textContent='Senha incorreta. Tente novamente.';
    btn.disabled=false;
  }
